[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microduck-brain"
version = "1.0.0"
description = "Decoupled four-tier brain architecture for the Microduck 14-DOF biped"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Eric Rolph" }
]
# Lightweight core runtime suitable for Raspberry Pi CM4 onboard deployment
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "onnxruntime>=1.15.0",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.0.0",
    "onnx>=1.15.0",
    "torch>=2.0.0",
]
vision = [
    "supervision>=0.25.0",
    "trackers>=2.0.0",
]
dev = [
    "mujoco>=3.0.0",
    "onnx>=1.15.0",
    "torch>=2.0.0",
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
    "supervision>=0.25.0",
    "trackers>=2.0.0",
]

[project.scripts]
microduck-run = "microduck_brain.cli:run_physical"
microduck-sim = "microduck_brain.cli:run_sim"
microduck-eval = "microduck_brain.cli:run_eval"
microduck-check = "microduck_brain.cli:check_duck"

[tool.setuptools.packages.find]
include = ["microduck_brain*", "scripts*"]

[tool.setuptools.package-data]
"microduck_brain.sim.mjcf" = ["*.xml", "assets/*.stl", "assets/*.part"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microduck-brain"
version = "0.1.0"
description = "Decoupled four-tier brain architecture for the Microduck quadruped robot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Eric Rolph" }
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "mujoco>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
]

[tool.setuptools.package-data]
"microduck_brain.sim.mjcf" = ["*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

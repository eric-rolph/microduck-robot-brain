# Disable RT throttling: allows SCHED_FIFO tasks to run 100% of the core uninterrupted
kernel.sched_rt_runtime_us = -1

# Disable cross-core timer migration to prevent waking up isolated cores
kernel.timer_migration = 0

# Disable software and hardware lockup watchdogs (removes periodic NMI/timer interrupts)
kernel.watchdog = 0
kernel.nmi_watchdog = 0
kernel.hung_task_timeout_secs = 0

# Reduce kernel memory statistics polling frequency (default is 1s; set to 2 minutes)
vm.stat_interval = 120

# Memory determinism: avoid swapping entirely and force early background writeouts
vm.swappiness = 0
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
